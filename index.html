<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>从词典 · Từ vựng tiếng Trung — Giáo trình & HSK 1·2·3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700;900&family=Noto+Serif+SC:wght@400;500;700;900&family=Ma+Shan+Zheng&family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1a1414;
  --ink-soft:#3a2e2a;
  --paper:#faf6ef;
  --paper-warm:#f3ebdd;
  --paper-deep:#ebe0cd;
  --seal:#8b1a1a;
  --seal-bright:#b22222;
  --seal-deep:#5a0f0f;
  --gold:#b8893f;
  --gold-soft:#d4af6a;
  --jade:#3d6b56;
  --line:rgba(26,20,20,.12);
  --line-soft:rgba(26,20,20,.06);
  --shadow:0 1px 3px rgba(26,20,20,.08), 0 4px 14px rgba(26,20,20,.06);
  --shadow-lg:0 4px 12px rgba(26,20,20,.1), 0 12px 40px rgba(26,20,20,.08);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink);font-family:'Inter','Noto Sans SC',sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:geometricPrecision}

body{
  background:
    radial-gradient(ellipse at top left, rgba(184,137,63,.06), transparent 60%),
    radial-gradient(ellipse at bottom right, rgba(139,26,26,.04), transparent 60%),
    var(--paper);
  min-height:100vh;
  padding-bottom:80px;
}

/* Header */
.site-header{
  position:relative;
  padding:48px 24px 32px;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg, rgba(243,235,221,.6), transparent);
  overflow:hidden;
}
.site-header::before{
  content:'';
  position:absolute;
  inset:0;
  background-image:
    repeating-linear-gradient(45deg,transparent 0 24px,rgba(184,137,63,.03) 24px 25px);
  pointer-events:none;
}
.header-inner{
  max-width:1200px;margin:0 auto;
  display:flex;align-items:center;gap:24px;justify-content:space-between;flex-wrap:wrap;
  position:relative;
}
.brand{display:flex;align-items:center;gap:18px}
.seal{
  width:64px;height:64px;border-radius:8px;
  background:var(--seal);color:var(--paper);
  display:grid;place-items:center;
  font-family:'Ma Shan Zheng','Noto Serif SC',serif;font-size:36px;font-weight:900;
  box-shadow:0 2px 0 var(--seal-deep), 0 8px 20px rgba(139,26,26,.25);
  transform:rotate(-3deg);
  position:relative;
  flex-shrink:0;
}
.seal::after{
  content:'';position:absolute;inset:3px;border:1.5px solid rgba(250,246,239,.4);border-radius:5px;
}
.brand-text h1{
  font-family:'Noto Serif SC',serif;font-weight:700;font-size:28px;letter-spacing:-.5px;color:var(--ink);
}
.brand-text h1 .zh{font-family:'Ma Shan Zheng',serif;color:var(--seal);font-weight:400;margin-right:8px}
.brand-text p{font-size:14px;color:var(--ink-soft);margin-top:2px;font-style:italic;font-family:'Lora',serif}

.header-stats{display:flex;gap:8px;flex-wrap:wrap}
.stat-chip{
  padding:6px 14px;border-radius:999px;
  background:var(--paper-warm);border:1px solid var(--line);
  font-size:13px;color:var(--ink-soft);
  display:inline-flex;align-items:center;gap:6px;
}
.stat-chip strong{color:var(--seal);font-weight:700}

/* Controls */
.controls{
  max-width:1200px;margin:24px auto 0;padding:0 24px;
  display:flex;gap:12px;align-items:center;flex-wrap:wrap;
}
.search-box{
  flex:1;min-width:240px;position:relative;
}
.search-box input{
  width:100%;padding:12px 16px 12px 44px;border:1px solid var(--line);
  background:#fff;border-radius:10px;font-size:15px;font-family:inherit;color:var(--ink);
  transition:border-color .2s, box-shadow .2s;
}
.search-box input:focus{outline:none;border-color:var(--seal);box-shadow:0 0 0 3px rgba(139,26,26,.08)}
.search-box svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-soft);width:18px;height:18px}

.voice-toggle{
  padding:11px 16px;border:1px solid var(--line);background:#fff;border-radius:10px;
  cursor:pointer;font-size:14px;color:var(--ink-soft);font-family:inherit;
  display:inline-flex;align-items:center;gap:8px;transition:all .2s;
  white-space:nowrap;
}
.voice-toggle:hover{background:var(--paper-warm)}
.voice-toggle.muted{color:#999;text-decoration:line-through}

/* Tabs */
.tabs{
  max-width:1200px;margin:24px auto 0;padding:0 24px;
  display:flex;gap:4px;overflow-x:auto;
  border-bottom:1px solid var(--line);
  scrollbar-width:thin;
}
.tabs::-webkit-scrollbar{height:4px}
.tabs::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px}
.tab{
  padding:12px 18px;border:none;background:none;cursor:pointer;
  font-family:inherit;font-size:14px;font-weight:500;color:var(--ink-soft);
  border-bottom:2px solid transparent;margin-bottom:-1px;
  white-space:nowrap;transition:color .2s, border-color .2s;
  display:inline-flex;align-items:center;gap:8px;
}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--seal);border-bottom-color:var(--seal);font-weight:600}
.tab-count{
  font-size:11px;padding:2px 7px;border-radius:999px;
  background:var(--paper-warm);color:var(--ink-soft);font-weight:500;
}
.tab.active .tab-count{background:var(--seal);color:var(--paper)}

/* Lesson nav (sub-tabs) */
.lesson-nav{
  max-width:1200px;margin:16px auto 0;padding:0 24px;
  display:flex;gap:6px;overflow-x:auto;flex-wrap:nowrap;
  scrollbar-width:thin;
}
.lesson-nav::-webkit-scrollbar{height:4px}
.lesson-pill{
  padding:7px 14px;border:1px solid var(--line);background:#fff;border-radius:999px;
  cursor:pointer;font-family:inherit;font-size:12.5px;color:var(--ink-soft);
  white-space:nowrap;transition:all .2s;flex-shrink:0;
}
.lesson-pill:hover{border-color:var(--seal);color:var(--seal)}
.lesson-pill.active{background:var(--seal);border-color:var(--seal);color:var(--paper)}
.lesson-pill .num{font-weight:700;font-family:'Lora',serif}

/* Lesson section header */
.section-header{
  max-width:1200px;margin:32px auto 16px;padding:0 24px;
  display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;
}
.section-title{
  font-family:'Noto Serif SC',serif;font-weight:700;font-size:24px;
  display:flex;align-items:baseline;gap:12px;
}
.section-title .zh{font-family:'Ma Shan Zheng',serif;font-weight:400;color:var(--seal);font-size:30px}
.section-subtitle{color:var(--ink-soft);font-style:italic;font-family:'Lora',serif;font-size:15px}

/* Vocab grid */
.vocab-grid{
  max-width:1200px;margin:0 auto;padding:0 24px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;
}

.vocab-card{
  background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:20px 20px 18px;
  transition:transform .25s, box-shadow .25s, border-color .25s;
  position:relative;overflow:hidden;
  display:flex;flex-direction:column;
}
.vocab-card::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg, var(--seal), var(--gold));
  opacity:0;transition:opacity .25s;
}
.vocab-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--gold-soft)}
.vocab-card:hover::before{opacity:1}

.card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:6px}

.chinese-word{
  font-family:'Noto Sans SC','Noto Serif SC',sans-serif;
  font-size:42px;font-weight:700;line-height:1.15;color:var(--ink);
  letter-spacing:.5px;
  letter-spacing:-.5px;
}
.audio-btn{
  flex-shrink:0;width:36px;height:36px;border-radius:50%;
  border:1px solid var(--line);background:var(--paper-warm);
  cursor:pointer;display:grid;place-items:center;
  color:var(--seal);transition:all .2s;
}
.audio-btn:hover{background:var(--seal);color:var(--paper);border-color:var(--seal);transform:scale(1.05)}
.audio-btn.playing{background:var(--seal);color:var(--paper);border-color:var(--seal);animation:pulse 1s ease-in-out infinite}
.audio-btn svg{width:16px;height:16px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

.pinyin{
  font-family:'Lora',serif;font-style:italic;font-size:17px;
  color:var(--seal);font-weight:500;margin-bottom:10px;
}

.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.type-tag{
  padding:2px 9px;border-radius:4px;
  font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;
  background:var(--jade);color:var(--paper);font-family:'Inter',sans-serif;
}
.type-tag.empty{background:var(--ink-soft);opacity:.5}

.meaning{
  font-size:15px;color:var(--ink);font-weight:500;
  padding-bottom:14px;margin-bottom:14px;border-bottom:1px dashed var(--line);
}

.examples{display:flex;flex-direction:column;gap:10px}
.example{
  padding:10px 12px;background:var(--paper-warm);border-radius:8px;
  border-left:3px solid var(--gold-soft);
  display:flex;align-items:flex-start;gap:8px;
}
.example-content{flex:1;min-width:0}
.example-cn{
  font-family:'Noto Sans SC','Noto Serif SC',sans-serif;font-size:16px;color:var(--ink);font-weight:600;
  line-height:1.45;margin-bottom:2px;letter-spacing:.3px;
}
.example-py{
  font-family:'Lora',serif;font-style:italic;font-size:13px;color:var(--ink-soft);
  margin-bottom:4px;
}
.example-vi{
  font-family:'Inter',sans-serif;font-size:13px;color:var(--seal);font-weight:500;
  line-height:1.4;
}
.example .audio-btn{width:28px;height:28px}
.example .audio-btn svg{width:13px;height:13px}

.no-examples{font-size:13px;color:var(--ink-soft);font-style:italic;padding:8px 0}



/* ============ RADICALS SECTION ============ */
.radicals-section{padding:0 24px;max-width:1280px;margin:0 auto}

.radicals-tips{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));
  gap:14px;margin-bottom:32px;
}
.radicals-tip{
  background:linear-gradient(135deg,#fff,var(--paper-warm));
  border:1px solid var(--line);border-radius:14px;
  padding:18px 20px;border-left:4px solid var(--seal);
  transition:all .2s;
}
.radicals-tip:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(139,26,26,.06)}
.radicals-tip-header{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.radicals-tip-icon{font-size:24px}
.radicals-tip-title{
  font-family:'Noto Serif SC',serif;color:var(--ink);font-weight:700;font-size:15px;
}
.radicals-tip-content{
  font-size:13.5px;color:var(--ink);line-height:1.6;
}

.radical-group-header{
  display:flex;align-items:baseline;gap:12px;
  margin:32px 0 16px 0;padding-bottom:10px;
  border-bottom:2px solid var(--paper-deep);
}
.radical-group-header .icon{font-size:28px;line-height:1}
.radical-group-header .zh{
  font-family:'Ma Shan Zheng',serif;color:var(--seal);font-size:24px;
}
.radical-group-header .vi{
  font-family:'Noto Serif SC',serif;color:var(--ink);font-weight:700;font-size:18px;
}
.radical-group-header .count{
  margin-left:auto;font-size:12px;color:var(--ink-soft);font-style:italic;font-family:'Lora',serif;
}

.radical-cards{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;
}

.radical-card{
  background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:18px;transition:all .2s;
  border-left:4px solid var(--gold-soft);position:relative;
}
.radical-card:hover{
  transform:translateY(-2px);box-shadow:0 4px 16px rgba(139,26,26,.08);
  border-left-color:var(--seal);
}

.radical-head{
  display:flex;align-items:flex-start;gap:14px;margin-bottom:12px;
}
.radical-char{
  font-family:'Noto Sans SC','Noto Serif SC',sans-serif;
  font-size:54px;font-weight:700;line-height:1;color:var(--ink);
  background:var(--paper-warm);padding:10px 18px;border-radius:12px;
  border:1px solid var(--line);min-width:80px;text-align:center;
  letter-spacing:1px;
}
.radical-char .alt{
  display:block;font-size:24px;color:var(--seal);margin-top:4px;font-weight:600;
}
.radical-meta{flex:1;min-width:0}
.radical-name{
  font-family:'Noto Serif SC',serif;font-weight:700;color:var(--ink);
  font-size:15px;margin-bottom:4px;line-height:1.3;
}
.radical-pinyin{
  font-family:'Lora',serif;font-style:italic;color:var(--seal);
  font-weight:600;font-size:14px;margin-bottom:4px;
}
.radical-stats{
  font-size:11.5px;color:var(--ink-soft);font-style:italic;
  display:flex;flex-wrap:wrap;gap:8px;
}
.radical-stats .chip{
  background:var(--paper-warm);padding:2px 8px;border-radius:6px;
  border:1px solid var(--line);font-style:normal;
}

.radical-meaning{
  font-size:13.5px;color:var(--ink);line-height:1.5;
  padding:8px 12px;background:var(--paper-warm);border-radius:8px;
  margin-bottom:10px;
  border-left:3px solid var(--gold);
}
.radical-mnemonic{
  font-size:13px;color:var(--ink);line-height:1.55;font-style:italic;
  padding:8px 12px;background:#f9f4eb;border-radius:8px;
  margin-bottom:12px;
  border-left:3px solid var(--jade);
}
.radical-mnemonic::before{
  content:'💡 Mẹo nhớ: ';font-style:normal;font-weight:600;color:var(--jade);
}

.radical-examples-label{
  font-size:11.5px;color:var(--ink-soft);text-transform:uppercase;
  letter-spacing:.5px;margin-bottom:6px;font-weight:600;
}
.radical-examples{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;
}
.radical-example{
  display:flex;align-items:center;gap:8px;
  padding:6px 8px;background:var(--paper-warm);border-radius:6px;
  cursor:pointer;transition:all .15s;
  border:1px solid transparent;
}
.radical-example:hover{
  background:#fff;border-color:var(--seal);
  transform:scale(1.03);
}
.radical-example .ex-cn{
  font-family:'Noto Sans SC',sans-serif;font-size:18px;font-weight:600;color:var(--ink);
}
.radical-example .ex-info{flex:1;min-width:0;line-height:1.2}
.radical-example .ex-py{
  font-family:'Lora',serif;font-style:italic;font-size:11px;color:var(--seal);font-weight:600;
}
.radical-example .ex-vi{font-size:11px;color:var(--ink-soft)}

@media (max-width: 640px){
  .radical-cards{grid-template-columns:1fr}
  .radicals-tips{grid-template-columns:1fr}
  .radical-char{font-size:42px;min-width:60px;padding:8px 12px}
  .radical-examples{grid-template-columns:1fr}
}


.radical-card{position:relative}
.radical-num{
  position:absolute;top:8px;right:10px;
  font-family:'Lora',serif;font-style:italic;font-size:11px;font-weight:600;
  color:var(--ink-soft);background:var(--paper-warm);
  padding:2px 8px;border-radius:6px;border:1px solid var(--line);
}
.radical-hanviet{
  display:inline-block;
  font-family:'Noto Serif SC',serif;font-style:normal;font-size:13px;
  color:var(--gold);font-weight:600;margin-left:4px;
}
.radical-hanviet::before{content:'· '}

/* ============ PINYIN SECTION ============ */
.pinyin-tabs{
  display:flex;gap:6px;flex-wrap:wrap;padding:0 24px;margin-bottom:24px;
}
.pinyin-tab{
  padding:8px 16px;background:#fff;border:1.5px solid var(--line);
  border-radius:999px;cursor:pointer;font-family:inherit;font-size:13px;
  color:var(--ink-soft);font-weight:500;transition:all .15s;
  white-space:nowrap;
}
.pinyin-tab:hover{border-color:var(--seal);color:var(--seal)}
.pinyin-tab.active{background:var(--seal);color:var(--paper);border-color:var(--seal);font-weight:600}

.pinyin-section{padding:0 24px;max-width:1280px;margin:0 auto}
.pinyin-group{
  margin-bottom:32px;
}
.pinyin-group-title{
  display:flex;align-items:baseline;gap:12px;
  margin-bottom:14px;padding-bottom:8px;
  border-bottom:2px solid var(--paper-deep);
}
.pinyin-group-title .zh{
  font-family:'Ma Shan Zheng',serif;color:var(--seal);font-size:24px;font-weight:400;
}
.pinyin-group-title .vi{
  font-family:'Noto Serif SC',serif;color:var(--ink);font-weight:600;font-size:17px;
}
.pinyin-group-title .count{
  margin-left:auto;font-size:12px;color:var(--ink-soft);font-style:italic;font-family:'Lora',serif;
}

.pinyin-cards{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;
}

.pinyin-card{
  background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:18px;position:relative;transition:all .2s;
  border-left:4px solid var(--gold-soft);
}
.pinyin-card:hover{
  transform:translateY(-2px);box-shadow:0 4px 16px rgba(139,26,26,.08);
  border-left-color:var(--seal);
}

.pinyin-card-header{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;margin-bottom:10px;
}
.pinyin-symbol{
  font-family:'Lora',serif;font-style:italic;font-size:36px;font-weight:600;
  color:var(--seal);line-height:1;letter-spacing:1px;
}
.pinyin-symbol.tone-1::after{content:'¯';margin-left:4px;color:var(--gold)}
.pinyin-symbol.tone-2::after{content:'/';margin-left:4px;color:var(--gold)}
.pinyin-symbol.tone-3::after{content:'ˇ';margin-left:4px;color:var(--gold)}
.pinyin-symbol.tone-4::after{content:'\\';margin-left:4px;color:var(--gold)}

.pinyin-tone-label{
  font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;
  color:var(--paper);background:var(--jade);padding:4px 8px;border-radius:6px;
  font-family:'Inter',sans-serif;
}

.pinyin-vi-approx{
  font-size:13px;color:var(--ink);margin-bottom:6px;
  background:var(--paper-warm);padding:6px 10px;border-radius:6px;
  border-left:3px solid var(--gold);
}
.pinyin-vi-approx strong{color:var(--seal)}

.pinyin-type{
  font-size:12px;color:var(--ink-soft);font-style:italic;font-family:'Lora',serif;
  margin-bottom:8px;
}
.pinyin-desc{
  font-size:13.5px;color:var(--ink);line-height:1.55;margin-bottom:12px;
  padding-bottom:12px;border-bottom:1px dashed var(--line);
}

.pinyin-examples{display:flex;flex-direction:column;gap:8px}
.pinyin-example{
  display:flex;align-items:center;gap:10px;
  padding:8px 10px;background:var(--paper-warm);border-radius:8px;
}
.pinyin-example .ex-cn{
  font-family:'Noto Sans SC','Noto Serif SC',sans-serif;font-size:18px;
  font-weight:600;color:var(--ink);min-width:50px;
}
.pinyin-example .ex-py{
  font-family:'Lora',serif;font-style:italic;font-size:13px;
  color:var(--seal);font-weight:500;flex:1;
}
.pinyin-example .ex-vi{
  font-size:12px;color:var(--ink-soft);font-style:italic;
}
.pinyin-example .audio-btn{
  width:30px;height:30px;flex-shrink:0;
}
.pinyin-example .audio-btn svg{width:14px;height:14px}

/* Tone visual indicator */
.tone-visual{
  display:inline-block;margin-left:8px;width:30px;height:18px;
  vertical-align:middle;
}
.tone-bar{
  font-size:10px;color:var(--ink-soft);font-style:italic;
  font-family:'Lora',serif;margin-bottom:4px;
}

/* Sandhi cards */
.sandhi-card{
  background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:18px;margin-bottom:16px;border-left:4px solid var(--seal);
}
.sandhi-card h4{
  font-family:'Noto Serif SC',serif;color:var(--ink);font-weight:700;
  font-size:16px;margin-bottom:8px;
}
.sandhi-rule{
  font-size:14px;color:var(--ink);line-height:1.6;margin-bottom:14px;
  padding:10px 14px;background:var(--paper-warm);border-radius:8px;
}
.sandhi-examples{display:flex;flex-direction:column;gap:8px}
.sandhi-example{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:10px 12px;background:#fafafa;border-radius:8px;
  border-left:3px solid var(--gold-soft);
}
.sandhi-example .cn{
  font-family:'Noto Sans SC',sans-serif;font-size:18px;font-weight:600;color:var(--ink);
}
.sandhi-example .arrow{color:var(--gold);font-weight:700}
.sandhi-example .py-orig{
  font-family:'Lora',serif;font-style:italic;color:var(--ink-soft);
  text-decoration:line-through;font-size:13px;
}
.sandhi-example .py-new{
  font-family:'Lora',serif;font-style:italic;color:var(--seal);
  font-weight:600;font-size:14px;
}
.sandhi-example .vi{font-size:12px;color:var(--ink-soft);margin-left:auto;font-style:italic}

/* Greeting cards */
.greeting-card{
  background:#fff;border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;display:flex;align-items:center;gap:14px;
  transition:all .15s;border-left:3px solid var(--gold-soft);
}
.greeting-card:hover{
  transform:translateX(3px);border-left-color:var(--seal);
  box-shadow:0 2px 10px rgba(139,26,26,.06);
}
.greeting-card .greet-cn{
  font-family:'Noto Sans SC',sans-serif;font-size:22px;font-weight:600;
  color:var(--ink);min-width:140px;letter-spacing:.5px;
}
.greeting-card .greet-content{flex:1;min-width:0}
.greeting-card .greet-py{
  font-family:'Lora',serif;font-style:italic;color:var(--seal);
  font-weight:500;font-size:14px;margin-bottom:2px;
}
.greeting-card .greet-vi{font-size:14px;color:var(--ink);margin-bottom:3px}
.greeting-card .greet-note{font-size:11px;color:var(--ink-soft);font-style:italic}

.greetings-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px;
}

/* Practice rows */
.practice-group{margin-bottom:28px}
.practice-row{
  display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;
  padding:10px 12px;background:#fff;border-radius:10px;
  border:1px solid var(--line);
}
.practice-syllable{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:8px 12px;background:var(--paper-warm);
  border-radius:8px;cursor:pointer;transition:all .15s;
  border:1px solid transparent;
  flex:1;min-width:90px;text-align:center;
}
.practice-syllable:hover{
  background:var(--seal);border-color:var(--seal);
  transform:scale(1.05);box-shadow:0 2px 8px rgba(139,26,26,.15);
}
.practice-syllable .ps-py{
  font-family:'Lora',serif;font-style:italic;font-size:15px;font-weight:600;
  color:var(--seal);line-height:1.2;
}
.practice-syllable:hover .ps-py{color:#fff8e6}
.practice-syllable .ps-cn{
  font-family:'Noto Sans SC',sans-serif;font-size:13px;font-weight:500;
  color:var(--ink-soft);line-height:1.2;
}
.practice-syllable:hover .ps-cn{color:var(--paper)}

@media (max-width: 640px){
  .pinyin-cards{grid-template-columns:1fr}
  .greetings-grid{grid-template-columns:1fr}
  .greeting-card .greet-cn{font-size:20px;min-width:auto}
}

/* Empty state */
.empty-state{
  max-width:600px;margin:80px auto;padding:40px 24px;text-align:center;
  color:var(--ink-soft);
}
.empty-state .big{font-family:'Ma Shan Zheng',serif;font-size:80px;color:var(--paper-deep);line-height:1;margin-bottom:16px}
.empty-state h3{font-family:'Noto Serif SC',serif;color:var(--ink);margin-bottom:8px}

/* Footer */
.site-footer{
  max-width:1200px;margin:60px auto 0;padding:24px;
  border-top:1px solid var(--line);
  text-align:center;color:var(--ink-soft);font-size:13px;
}
.site-footer .zh{font-family:'Ma Shan Zheng',serif;color:var(--seal);font-size:18px;display:inline-block;margin:0 6px}

/* Mobile */
@media (max-width:640px){
  .site-header{padding:32px 16px 24px}
  .brand-text h1{font-size:22px}
  .seal{width:52px;height:52px;font-size:28px}
  .controls,.tabs,.lesson-nav,.section-header,.vocab-grid{padding-left:16px;padding-right:16px}
  .vocab-grid{grid-template-columns:1fr;gap:14px}
  .chinese-word{font-size:34px}
  .section-title{font-size:20px}
  .section-title .zh{font-size:24px}
}

/* Subtle animation on load */
.vocab-card{animation:fadeUp .4s ease-out backwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* Print-friendly */
@media print{
  body{background:#fff}
  .controls,.tabs,.lesson-nav,.audio-btn,.site-footer{display:none}
  .vocab-card{break-inside:avoid;border:1px solid #ccc;box-shadow:none}
}

in":"hé","type_zh":"连","type_vi":"liên từ","meaning":"và","examples":[{"cn":"今天我和朋友去学校。","py":"Jīntiān wǒ hé péngyǒu qù xuéxiào","vi":"Hôm nay tôi và bạn đến trường."},{"cn":"我们和妈妈吃饭。","py":"Wǒmen hé māma chīfàn","vi":"Chúng tôi ăn cơm với mẹ."}]},{"chinese":"本","pinyin":"běn","type_zh":"量","type_vi":"lượng từ","meaning":"quyển, cuốn","examples":[{"cn":"那本书在桌子上呢。","py":"Nà běn shū zài zhuōzi shàng ne","vi":"Quyển sách đó ở trên bàn kìa."},{"cn":"我买了八本书。","py":"Wǒ mǎi le bā běn shū","vi":"Tôi đã mua tám quyển sách."}]},{"chinese":"里","pinyin":"lǐ","type_zh":"名","type_vi":"danh từ","meaning":"trong, bên trong","examples":[{"cn":"学校里有很多学生。","py":"Xuéxiào lǐ yǒu hěnduō xuéshēng","vi":"Trong trường có rất nhiều học sinh."},{"cn":"我的书在书包里。","py":"Wǒ de shū zài shūbāo lǐ","vi":"Sách của tôi ở trong cặp."}]},{"chinese":"前面","pinyin":"qiánmiàn","type_zh":"名","type_vi":"danh từ","meaning":"phía trước","examples":[{"cn":"前面那个人叫什么名字？","py":"Qiánmiàn nàgè rén jiào shénme míngzi?","vi":"Người ở phía trước tên là gì?"},{"cn":"我家就在前面。","py":"Wǒ jiā jiù zài qiánmiàn","vi":"Nhà tôi ngay phía trước."}]},{"chinese":"后面","pinyin":"hòumiàn","type_zh":"名","type_vi":"danh từ","meaning":"phía sau","examples":[{"cn":"后面那个人呢？","py":"Hòumiàn nàgè rén ne?","vi":"Còn người phía sau thì sao?"},{"cn":"学校在医院后面。","py":"Xuéxiào zài yīyuàn hòumiàn","vi":"Trường ở phía sau bệnh viện."}]},{"chinese":"这儿","pinyin":"zhèr","type_zh":"代","type_vi":"đại từ","meaning":"chỗ này, ở đây","examples":[{"cn":"王方在这儿。","py":"Wáng Fāng zài zhèr","vi":"Vương Phương ở đây."},{"cn":"这儿有很多美国人。","py":"Zhèr yǒu hěnduō Měiguó rén","vi":"Ở đây có rất nhiều người Mỹ."}]},{"chinese":"没有（没）","pinyin":"méiyǒu (méi)","type_zh":"副","type_vi":"phó từ","meaning":"không có","examples":[{"cn":"我家今天没有人。","py":"Wǒ jiā jīntiān méiyǒu rén","vi":"Hôm nay nhà tôi không có ai."},{"cn":"他没有钱。","py":"Tā méiyǒu qián","vi":"Anh ấy không có tiền."}]},{"chinese":"能","pinyin":"néng","type_zh":"能源","type_vi":"","meaning":"có thể","examples":[{"cn":"明 g Trung."},{"cn":"中文书。","py":"Zhōngwén shū.","vi":"Sách tiếng Trung."}]},{"chinese":"终于","pinyin":"zhōngyú","type_zh":"副","type_vi":"phó từ","meaning":"cuối cùng","examples":[{"cn":"终于来了!","py":"zhōngyú lái le!","vi":"Cuối cùng cũng đến rồi!"},{"cn":"终于成功!","py":"zhōngyú chénggōng!","vi":"Cuối cùng cũng thành công!"}]},{"chinese":"种","pinyin":"zhǒng","type_zh":"量","type_vi":"lượng từ","meaning":"loại, kiểu","examples":[{"cn":"三种水果。","py":"sān zhǒng shuǐguǒ.","vi":"Ba loại trái cây."},{"cn":"这种菜。","py":"zhè zhǒng cài.","vi":"Loại món ăn này."}]},{"chinese":"重要","pinyin":"zhòngyào","type_zh":"形","type_vi":"tính từ","meaning":"quan trọng","examples":[{"cn":"很重要!","py":"hěn zhòngyào!","vi":"Rất quan trọng!"},{"cn":"重要的事情。","py":"zhòngyào de shìqing.","vi":"Việc quan trọng."}]},{"chinese":"周末","pinyin":"zhōumò","type_zh":"名","type_vi":"danh từ","meaning":"cuối tuần","examples":[{"cn":"周末快乐!","py":"zhōumò kuàilè!","vi":"Cuối tuần vui vẻ!"},{"cn":"这个周末。","py":"zhège zhōumò.","vi":"Cuối tuần này."}]},{"chinese":"主要","pinyin":"zhǔyào","type_zh":"形","type_vi":"tính từ","meaning":"chủ yếu","examples":[{"cn":"主要问题。","py":"zhǔyào wèntí.","vi":"Vấn đề chính."},{"cn":"主要原因。","py":"zhǔyào yuányīn.","vi":"Nguyên nhân chính."}]},{"chinese":"注意","pinyin":"zhùyì","type_zh":"动","type_vi":"động từ","meaning":"chú ý","examples":[{"cn":"请注意!","py":"qǐng zhùyì!","vi":"Xin chú ý!"},{"cn":"注意身体。","py":"zhùyì shēntǐ.","vi":"Chú ý sức khỏe."}]},{"chinese":"祝","pinyin":"zhù","type_zh":"动","type_vi":"động từ","meaning":"chúc","examples":[{"cn":"祝你生日快乐!","py":"zhù nǐ shēngrì kuàilè!","vi":"Chúc bạn sinh nhật vui vẻ!"},{"cn":"祝你成功。","py":"zhù nǐ chénggōng.","vi":"Chúc bạn thành công."}]},{"chinese":"自己","pinyin":"zìjǐ","type_zh":"代","type_vi":"đại từ","meaning":"bản thân, tự mình","examples":[{"cn":"我自己。","py":"wǒ zìjǐ.","vi":"Bản thân tôi."},{"cn":"自己来。","py":"zìjǐ lái.","vi":"Tự mình làm."}]},{"chinese":"自行车","pinyin":"zìxíngchē","type_zh":"名","type_vi":"danh từ","meaning":"xe đạp","examples":[{"cn":"我的自行车。","py":"wǒ de zìxíngchē.","vi":"Xe đạp của tôi."},{"cn":"骑自行车。","py":"qí zìxíngchē.","vi":"Đi xe đạp."}]},{"chinese":"总是","pinyin":"zǒngshì","type_zh":"副","type_vi":"phó từ","meaning":"luôn luôn","examples":[{"cn":"他总是很忙。","py":"tā zǒngshì hěn máng.","vi":"Anh ấy luôn rất bận."},{"cn":"我总是来。","py":"wǒ zǒngshì lái.","vi":"Tôi luôn đến."}]},{"chinese":"嘴","pinyin":"zuǐ","type_zh":"名","type_vi":"danh từ","meaning":"miệng, mồm","examples":[{"cn":"张嘴。","py":"zhāng zuǐ.","vi":"Mở miệng."},{"cn":"我的嘴。","py":"wǒ de zuǐ.","vi":"Miệng của tôi."}]},{"chinese":"最后","pinyin":"zuìhòu","type_zh":"名","type_vi":"danh từ","meaning":"cuối cùng","examples":[{"cn":"最后的人。","py":"zuìhòu de rén.","vi":"Người cuối cùng."},{"cn":"最后我去了。","py":"zuìhòu wǒ qù le.","vi":"Cuối cùng tôi đã đi."}]},{"chinese":"最近","pinyin":"zuìjìn","type_zh":"名","type_vi":"danh từ","meaning":"gần đây","examples":[{"cn":"最近忙吗?","py":"zuìjìn máng ma?","vi":"Gần đây có bận không?"},{"cn":"最近怎么样?","py":"zuìjìn zěnmeyàng?","vi":"Gần đây thế nào?"}]}]}}</script>

<script>
const DATA = JSON.parse(document.getElementById('vocab-data').textContent);

// State
let voiceEnabled = true;
let currentTab = 'lesson';
let currentLesson = 0; // index for lessons
let currentHsk = 1;
let searchQuery = '';
let currentPinyinSection = 'initials';
let currentRadicalSection = 'tips';

// DOM refs
const $tabs = document.getElementById('main-tabs');
const $subNav = document.getElementById('sub-nav');
const $content = document.getElementById('content');
const $search = document.getElementById('search');
const $voiceToggle = document.getElementById('voice-toggle');
const $stats = document.getElementById('header-stats');

// Build header stats
function renderStats(){
  const lessonCount = DATA.lessons.reduce((s,l)=>s+l.vocab.length,0);
  const hsk1 = DATA.hsk.HSK1.length;
  const hsk2 = DATA.hsk.HSK2.length;
  const hsk3 = DATA.hsk.HSK3.length;
  const total = lessonCount + hsk1 + hsk2 + hsk3;
  $stats.innerHTML = `
    <span class="stat-chip"><strong>${total}</strong> từ</span>
    <span class="stat-chip"><strong>${lessonCount}</strong> giáo trình</span>
    <span class="stat-chip"><strong>${hsk1+hsk2+hsk3}</strong> HSK</span>
  `;
}

// Build main tabs
function renderTabs(){
  const lessonTotal = DATA.lessons.reduce((s,l)=>s+l.vocab.length,0);
  const hsk1 = DATA.hsk.HSK1.length;
  const hsk2 = DATA.hsk.HSK2.length;
  const hsk3 = DATA.hsk.HSK3.length;
  $tabs.innerHTML = `
    <button class="tab ${currentTab==='pinyin'?'active':''}" data-tab="pinyin">🔤 Phiên âm</button>
    <button class="tab ${currentTab==='radicals'?'active':''}" data-tab="radicals">🌳 Bộ thủ</button>
    <button class="tab ${currentTab==='lesson'?'active':''}" data-tab="lesson">📚 Giáo trình <span class="tab-count">${lessonTotal}</span></button>
    <button class="tab ${currentTab==='hsk1'?'active':''}" data-tab="hsk1">HSK 1 <span class="tab-count">${hsk1}</span></button>
    <button class="tab ${currentTab==='hsk2'?'active':''}" data-tab="hsk2">HSK 2 <span class="tab-count">${hsk2}</span></button>
    <button class="tab ${currentTab==='hsk3'?'active':''}" data-tab="hsk3">HSK 3 <span class="tab-count">${hsk3}</span></button>
  `;
  $tabs.querySelectorAll('.tab').forEach(btn=>{
    btn.addEventListener('click',()=>{
      currentTab = btn.dataset.tab;
      searchQuery = '';
      $search.value='';
      // Hide search box for pinyin tab (search doesn't apply)
      const searchBox = document.querySelector('.controls');
      if(searchBox) searchBox.style.display = (currentTab==='pinyin'||currentTab==='radicals') ? 'none' : 'flex';
      renderTabs();
      renderSubNav();
      render();
    });
  });
}

// Sub navigation (lessons / pinyin sections / empty for HSK)
function renderSubNav(){
  if(currentTab === 'radicals'){
    $subNav.style.display='flex';
    const groups = [{id:'tips', label:'📖 Phương pháp học'}].concat(
      RADICALS.groups.map((g,i)=>({id:'g'+i, label:(g.icon||'')+' '+g.name}))
    );
    $subNav.innerHTML = groups.map(g=>`
      <button class="lesson-pill ${g.id===currentRadicalSection?'active':''}" data-rid="${g.id}">
        ${g.label}
      </button>
    `).join('');
    $subNav.querySelectorAll('.lesson-pill').forEach(b=>{
      b.addEventListener('click',()=>{
        currentRadicalSection = b.dataset.rid;
        renderSubNav();
        render();
      });
    });
    return;
  }
  if(currentTab === 'pinyin'){
    $subNav.style.display='flex';
    const sections = [
      {id:'initials', label:'声母 · Thanh mẫu'},
      {id:'finals', label:'韵母 · Vận mẫu'},
      {id:'tones', label:'声调 · Thanh điệu'},
      {id:'sandhi', label:'变调 · Biến điệu'},
      {id:'greetings', label:'问候 · Chào hỏi'},
      {id:'practice', label:'练习 · Luyện tập'}
    ];
    $subNav.innerHTML = sections.map(s=>`
      <button class="lesson-pill ${s.id===currentPinyinSection?'active':''}" data-pid="${s.id}">
        ${s.label}
      </button>
    `).join('');
    $subNav.querySelectorAll('.lesson-pill').forEach(b=>{
      b.addEventListener('click',()=>{
        currentPinyinSection = b.dataset.pid;
        renderSubNav();
        render();
      });
    });
    return;
  }
  if(currentTab !== 'lesson'){
    $subNav.style.display='none';
    return;
  }
  $subNav.style.display='flex';
  $subNav.innerHTML = DATA.lessons.map((l,i)=>`
    <button class="lesson-pill ${i===currentLesson?'active':''}" data-idx="${i}">
      <span class="num">${l.lesson.replace('Bài ','B')}</span> · ${l.title_zh}
    </button>
  `).join('');
  $subNav.querySelectorAll('.lesson-pill').forEach(b=>{
    b.addEventListener('click',()=>{
      currentLesson = parseInt(b.dataset.idx);
      renderSubNav();
      render();
    });
  });
}

// Get current vocab list with metadata
function getCurrentList(){
  if(currentTab === 'lesson'){
    const lesson = DATA.lessons[currentLesson];
    return {
      titleZh: lesson.title_zh,
      titleVi: lesson.title_vi,
      label: lesson.lesson,
      vocab: lesson.vocab
    };
  }
  const key = currentTab.toUpperCase();
  return {
    titleZh: key === 'HSK1' ? '初级一' : key === 'HSK2' ? '初级二' : '中级一',
    titleVi: `Bộ từ ${key.replace('HSK','HSK ')} — ${DATA.hsk[key].length} từ thông dụng`,
    label: key.replace('HSK','HSK '),
    vocab: DATA.hsk[key]
  };
}

// Filter
function filterVocab(list){
  if(!searchQuery.trim()) return list;
  const q = searchQuery.toLowerCase().trim();
  return list.filter(v=>{
    return v.chinese.includes(q) ||
           (v.pinyin||'').toLowerCase().includes(q) ||
           (v.meaning||'').toLowerCase().includes(q) ||
           (v.type_vi||'').toLowerCase().includes(q);
  });
}

const SPEAKER_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>`;

// Render content
function render(){
  if(currentTab === 'pinyin'){
    renderPinyin();
    return;
  }
  if(currentTab === 'radicals'){
    renderRadicals();
    return;
  }
  const data = getCurrentList();
  let vocab = filterVocab(data.vocab);

  let header = `
    <div class="section-header">
      <div class="section-title"><span class="zh">${data.titleZh}</span><span>${data.label}</span></div>
      <div class="section-subtitle">${data.titleVi} · ${vocab.length} từ${searchQuery?` (lọc từ ${data.vocab.length})`:''}</div>
    </div>
  `;

  if(vocab.length === 0){
    $content.innerHTML = header + `
      <div class="empty-state">
        <div class="big">空</div>
        <h3>Không tìm thấy từ nào</h3>
        <p>Thử từ khóa khác hoặc xóa bộ lọc.</p>
      </div>
    `;
    return;
  }

  const cards = vocab.map((v,i)=>{
    const examples = (v.examples && v.examples.length) ? v.examples.map(e=>`
      <div class="example">
        <div class="example-content">
          <div class="example-cn">${escapeHtml(e.cn)}</div>
          <div class="example-py">${escapeHtml(e.py)}</div>
          ${e.vi ? `<div class="example-vi">${escapeHtml(e.vi)}</div>` : ''}
        </div>
        <button class="audio-btn" data-speak="${escapeAttr(e.cn)}" title="Phát âm">${SPEAKER_SVG}</button>
      </div>
    `).join('') : `<div class="no-examples">Chưa có câu ví dụ</div>`;

    const typeHtml = v.type_vi
      ? `<span class="type-tag">${escapeHtml(v.type_vi)}</span>`
      : (v.type_zh ? `<span class="type-tag empty">${escapeHtml(v.type_zh)}</span>` : '');

    return `
      <article class="vocab-card" style="animation-delay:${Math.min(i*20,400)}ms">
        <div class="card-header">
          <div class="chinese-word">${escapeHtml(v.chinese)}</div>
          <button class="audio-btn" data-speak="${escapeAttr(v.chinese)}" title="Phát âm">${SPEAKER_SVG}</button>
        </div>
        <div class="pinyin">${escapeHtml(v.pinyin||'')}</div>
        <div class="meta">${typeHtml}</div>
        <div class="meaning">${escapeHtml(v.meaning||'')}</div>
        <div class="examples">${examples}</div>
      </article>
    `;
  }).join('');

  $content.innerHTML = header + `<div class="vocab-grid">${cards}</div>`;

  // Wire up audio buttons
  $content.querySelectorAll('[data-speak]').forEach(btn=>{
    btn.addEventListener('click',e=>{
      e.stopPropagation();
      const text = btn.getAttribute('data-speak');
      speak(text, btn);
    });
  });
}

function renderPinyin(){
  const sec = currentPinyinSection;
  let html = '';
  if(sec === 'initials' || sec === 'finals'){
    const data = sec === 'initials' ? PINYIN.initials : PINYIN.finals;
    html = `
      <div class="section-header">
        <div class="section-title"><span class="zh">${data.title_zh}</span><span>${data.title}</span></div>
        <div class="section-subtitle">${data.subtitle}</div>
      </div>
      <div class="pinyin-section">
        ${data.groups.map(g=>`
          <div class="pinyin-group">
            <div class="pinyin-group-title">
              <span class="zh">${g.name_zh||''}</span>
              <span class="vi">${escapeHtml(g.name)}</span>
              <span class="count">${g.items.length} âm</span>
            </div>
            <div class="pinyin-cards">
              ${g.items.map(it=>renderPinyinCard(it)).join('')}
            </div>
          </div>
        `).join('')}
      </div>
    `;
  } else if(sec === 'tones'){
    const data = PINYIN.tones;
    html = `
      <div class="section-header">
        <div class="section-title"><span class="zh">${data.title_zh}</span><span>${data.title}</span></div>
        <div class="section-subtitle">${data.subtitle}</div>
      </div>
      <div class="pinyin-section">
        <div class="pinyin-cards">
          ${data.items.map((t,i)=>renderToneCard(t,i+1)).join('')}
        </div>
      </div>
    `;
  } else if(sec === 'sandhi'){

function renderPinyinCard(it){
  const examples = (it.examples||[]).map(e=>`
    <div class="pinyin-example">
      <span class="ex-cn">${escapeHtml(e.cn)}</span>
      <span class="ex-py">${escapeHtml(e.py)}</span>
      <span class="ex-vi">${escapeHtml(e.vi||'')}</span>
      <button class="audio-btn" data-speak="${escapeAttr(e.cn)}" title="Phát âm">${SPEAKER_SVG}</button>
    </div>
  `).join('');
  return `
    <div class="pinyin-card">
      <div class="pinyin-card-header">
        <div class="pinyin-symbol">${escapeHtml(it.py)}</div>
        <button class="audio-btn" data-speak="${escapeAttr(it.demo_cn||(it.examples&&it.examples[0]?it.examples[0].cn:it.py))}" title="Phát âm">${SPEAKER_SVG}</button>
      </div>
      ${it.vi_approx?`<div class="pinyin-vi-approx"><strong>Cách đọc:</strong> ${escapeHtml(it.vi_approx)}${it.demo_cn?` <span style="float:right;color:var(--ink-soft);font-size:12px">🔊 ${escapeHtml(it.demo_cn)} <em>${escapeHtml(it.demo_py||'')}</em></span>`:''}</div>`:''}
      <div class="pinyin-type">${escapeHtml(it.type||'')}</div>
      <div class="pinyin-desc">${escapeHtml(it.desc||'')}</div>
      <div class="pinyin-examples">${examples}</div>
    </div>
  `;
}

function renderToneCard(t, num){
  const examples = (t.examples||[]).map(e=>`
    <div class="pinyin-example">
      <span class="ex-cn">${escapeHtml(e.cn)}</span>
      <span class="ex-py">${escapeHtml(e.py)}</span>
      <span class="ex-vi">${escapeHtml(e.vi||'')}</span>
      <button class="audio-btn" data-speak="${escapeAttr(e.cn)}" title="Phát âm">${SPEAKER_SVG}</button>
    </div>
  `).join('');
  return `
    <div class="pinyin-card">
      <div class="pinyin-card-header">
        <div class="pinyin-symbol">${escapeHtml(t.symbol||'')}<span style="font-size:14px;color:var(--ink-soft);margin-left:8px">${escapeHtml(t.name)}</span></div>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="pinyin-tone-label">${escapeHtml(t.name_zh||'')}</span>
          ${t.demo_cn ? `<button class="audio-btn" data-speak="${escapeAttr(t.demo_cn)}" title="Nghe ${escapeAttr(t.demo_py||'')}">${SPEAKER_SVG}</button>` : ''}
        </div>
      </div>
      <div class="tone-bar">Mức độ: ${escapeHtml(t.level||'')}</div>
      <div class="pinyin-desc">${escapeHtml(t.desc||'')}</div>
      <div class="pinyin-examples">${examples}</div>
    </div>
  `;
}

":"Khuyển","vi_name":"Bộ Khuyển (chó)","meaning":"Chó","strokes":4,"alt":"犭","mnemonic":"犭 = chó vẫy đuôi đứng. Hầu như mọi chữ chỉ thú 4 chân (thú dữ) đều có bộ này.","examples":[{"cn":"狗","py":"gǒu","vi":"chó"},{"cn":"猫","py":"māo","vi":"mèo"},{"cn":"猪","py":"zhū","vi":"lợn"}],"position":"trái (犭)"},{"num":104,"char":"疒","pinyin":"nè","han_viet":"Nạch","vi_name":"Bộ Nạch (bệnh)","meaning":"Bệnh tật","strokes":5,"mnemonic":"Hình giường có người nằm. Bao quanh phần trên-trái. Mọi chữ về bệnh đều có bộ này.","examples":[{"cn":"病","py":"bìng","vi":"bệnh"},{"cn":"疼","py":"téng","vi":"đau"},{"cn":"痛","py":"tòng","vi":"đau"}],"position":"trên-trái (bao)"},{"num":106,"char":"白","pinyin":"bái","han_viet":"Bạch","vi_name":"Bộ Bạch (trắng)","meaning":"Trắng","strokes":5,"mnemonic":"Hình mặt trời mọc tỏa sáng. Liên quan đến màu trắng, sáng.","examples":[{"cn":"百","py":"bǎi","vi":"trăm"},{"cn":"的","py":"de","vi":"trợ từ"},{"cn":"皇","py":"huáng","vi":"vua"}],"position":"trái, dưới"},{"num":109,"char":"目","pinyin":"mù","han_viet":"Mục","vi_name":"Bộ Mục (mắt)","meaning":"Mắt","strokes":5,"mnemonic":"Hình con mắt dựng đứng. Chữ có bộ này thường liên quan đến nhìn, xem.","examples":[{"cn":"看","py":"kàn","vi":"nhìn"},{"cn":"睡","py":"shuì","vi":"ngủ"},{"cn":"眼","py":"yǎn","vi":"mắt"},{"cn":"睛","py":"jīng","vi":"tròng mắt"}],"position":"trái, phải"},{"num":112,"char":"石","pinyin":"shí","han_viet":"Thạch","vi_name":"Bộ Thạch (đá)","meaning":"Đá","strokes":5,"mnemonic":"Hình hòn đá rơi xuống từ vách núi. Liên quan đến đá, khoáng vật.","examples":[{"cn":"硬","py":"yìng","vi":"cứng"},{"cn":"破","py":"pò","vi":"vỡ"}],"position":"trái"},{"num":113,"char":"示","pinyin":"shì","han_viet":"Thị/Kỳ","vi_name":"Bộ Kỳ/Thị (chỉ/thờ)","meaning":"Bàn thờ, tế lễ","strokes":5,"alt":"礻","mnemonic":"礻 (4 nét) = bàn thờ - KHÁC với 衤 (5 nét) = áo. Chữ liên quan đến cúng, thần, may mắn.","examples":[{"cn":"神","py":"shén","vi":"thần"},{"cn":"祝","py":"zhù","vi":"chúc"},{"cn":"福","py":"fú","vi":"phúc"}],"position":"trái (礻)"},{"num":116,"char":"穴","pinyin":"xué","han_viet":"Huyệt","vi_name":"Bộ Huyệt (hang)","meaning":"Hang, lỗ","strokes":5,"mnemonic":"Hình mái nhà có 2 chân vào hang. Liên quan đến hang, lỗ, không gian rỗng.","examples":[{"cn":"空","py":"kōng","vi":"không, trống"},{"cn":"穿","py":"chuān","vi":"mặc, xuyên qua"},{"cn":"窗","py":"chuāng","vi":"cửa sổ"}],"position":"trên"},{"num":117,"char":"立","pinyin":"lì","han_viet":"Lập","vi_name":"Bộ Lập (đứng)","meaning":"Đứng, lập nên","strokes":5,"mnemonic":"Hình người đứng trên mặt đất. Liên quan đến đứng, lập.","examples":[{"cn":"站","py":"zhàn","vi":"đứng"},{"cn":"童","py":"tóng","vi":"trẻ con"},{"cn":"音","py":"yīn","vi":"âm thanh"}],"position":"trái, trên"},{"num":118,"char":"竹","pinyin":"zhú","han_viet":"Trúc","vi_name":"Bộ Trúc (tre)","meaning":"Cây tre","strokes":6,"alt":"⺮","mnemonic":"Hình 2 cây tre nhỏ. Vì xưa viết trên thẻ tre, nên chữ liên quan đến viết, đo lường thường có bộ này.","examples":[{"cn":"笔","py":"bǐ","vi":"bút"},{"cn":"答","py":"dá","vi":"trả lời"},{"cn":"等","py":"děng","vi":"chờ"},{"cn":"笑","py":"xiào","vi":"cười"}],"position":"trên (⺮)"},{"num":120,"char":"糸","pinyin":"mì","han_viet":"Mịch/Ti","vi_name":"Bộ Mịch/Ti (sợi tơ)","meaning":"Sợi tơ","strokes":6,"alt":"纟"},{"num":123,"char":"羊","pinyin":"yáng","han_viet":"Dương","vi_name":"Bộ Dương (cừu/dê)","meaning":"Cừu, dê","strokes":6,"mnemonic":"Hình mặt con cừu với 2 sừng cong. Vì cừu là biểu tượng tốt đẹp nên chữ liên quan đến tốt/đẹp đều có bộ này.","examples":[{"cn":"美","py":"měi","vi":"đẹp (羊+大)"},{"cn":"样","py":"yàng","vi":"kiểu"}],"position":"trên, trái"},{"num":128,"char":"耳","pinyin":"ěr","han_viet":"Nhĩ","vi_name":"Bộ Nhĩ (tai)","meaning":"Tai","strokes":6,"mnemonic":"Hình cái tai. Chữ có bộ này liên quan đến nghe.","examples":[{"cn":"听","py":"tīng","vi":"nghe"},{"cn":"聪","py":"cōng","vi":"thông minh"},{"cn":"声","py":"shēng","vi":"âm thanh"}],"position":"trái, phải"},{"num":140,"char":"艸","pinyin":"cǎo","han_viet":"Thảo","vi_name":"Bộ Thảo ộ mới, kết hợp ngay với chữ đang học."},{"icon":"🧠","title":"Phương pháp liên tưởng (Mnemonic)","content":"Đừng học khô khan 'bộ A = X nét'. Hãy biến mỗi bộ thành CÂU CHUYỆN. Ví dụ: '休' = 亻(người) + 木(cây) → 'Người ngồi tựa gốc cây = NGHỈ NGƠI'. Khi tạo câu chuyện càng buồn cười/lạ thì càng dễ nhớ."},{"icon":"✍️","title":"Viết tay là cách nhớ tốt nhất","content":"Viết mỗi bộ thủ 5-10 lần TRÊN GIẤY (không phải máy tính). Khi viết, đọc to tên bộ thủ + nghĩa. Não kích hoạt vùng vận động + thị giác + thính giác cùng lúc → nhớ sâu gấp 5 lần chỉ nhìn. Quan trọng: viết đúng thứ tự nét (笔顺)."},{"icon":"🔍","title":"Bộ thủ giúp đoán nghĩa","content":"Gặp chữ lạ? Tìm bộ thủ trước! 河 (chưa biết) → có 氵 (nước) → đoán liên quan đến nước → là 'sông'. 林 → 2 cái 木 (cây) → đoán là 'rừng'. Luyện thói quen này biến việc đọc chữ Hán thành trò chơi giải đố."},{"icon":"⚠️","title":"Các bộ thủ dễ nhầm lẫn","content":"礻(thị, 4 nét, bàn thờ) ≠ 衤(y, 5 nét, áo). 冫(2 chấm, băng) ≠ 氵(3 chấm, nước). 月(nguyệt) khi ở bên trái thường = 'thịt' (脸=mặt). 日(nhật) ≠ 曰(viết). 已(đã) ≠ 己(mình) ≠ 巳(rắn). Hãy chú ý từng nét!"},{"icon":"🎮","title":"Luyện tập hằng ngày","content":"5 phút/ngày: chọn 1 chữ Hán → tách ra các bộ thủ → giải thích cấu trúc. Ví dụ '想' = 相 (tướng) + 心 (tim) → 'tim đang nghĩ về một người' → 'NHỚ/MUỐN'. Sau 30 ngày bạn sẽ tự đoán được nghĩa của ~50% chữ Hán mới."}]};

function renderRadicals(){
  const sec = currentRadicalSection;
  let bodyHtml = '';
  
  if(sec === 'tips'){
    bodyHtml = `
      <div class="section-header">
        <div class="section-title"><span class="zh">${RADICALS.title_zh}</span><span>${RADICALS.title}</span></div>
        <div class="section-subtitle">${RADICALS.subtitle}</div>
      </div>
      <div class="radicals-section">
        <div class="radicals-tips">
          ${RADICALS.tips.map(t=>`
            <div class="radicals-tip">
              <div class="radicals-tip-header">
                <span class="radicals-tip-icon">${escapeHtml(t.icon||'')}</span>
                <span class="radicals-tip-title">${escapeHtml(t.title)}</span>
              </div>
              <div class="radicals-tip-content">${escapeHtml(t.content)}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  } else {
    // Group by id like 'g0', 'g1', ...
    const idx = parseInt(sec.replace('g',''));
    const group = RADICALS.groups[idx];
    if(!group){ bodyHtml = '<div class="empty"><div class="empty-icon">🤔</div><div>Không tìm thấy nhóm</div></div>'; }
    else {
      bodyHtml = `
        <div class="section-header">
          <div class="section-title"><span class="zh">${RADICALS.title_zh}</span><span>${escapeHtml(group.name)}</span></div>
          <div class="section-subtitle">${escapeHtml(group.name_zh||'')} · ${group.items.length} bộ thủ</div>
        </div>
        <div class="radicals-section">
          <div class="radical-cards">
            ${group.items.map(it=>renderRadicalCard(it)).join('')}
          </div>
        </div>
      `;
    }
  }
  
  $content.innerHTML = bodyHtml;
  
  // Wire up clickable example characters (speak the char)
  $content.querySelectorAll('[data-speak]').forEach(el=>{
    el.addEventListener('click',e=>{
      e.stopPropagation();
      speak(el.getAttribute('data-speak'), el);
    });
  });
}

function renderRadicalCard(it){
  const charDisplay = it.alt
    ? `${escapeHtml(it.char)}<span class="alt">${escapeHtml(it.alt)}</span>`
    : escapeHtml(it.char);
  
  const examples = (it.examples||[]).map(e=>`
    <div class="radical-example" data-speak="${escapeAttr(e.cn)}" title="Bấm để nghe">
      <span class="ex-cn">${escapeHtml(e.cn)}</span>
      <div class="ex-info">
        <div class="ex-py">${escapeHtml(e.py||'')}</div>
        <div class="ex-vi">${escapeHtml(e.vi||'')}</div>
      </div>
    </div>
  `).join('');
  
  const speakChar = it.alt || it.char;
  
  const numBadge = it.num ? `<span class="radical-num">#${it.num}</span>` : '';
  const hanViet = it.han_viet ? `<span class="radical-hanviet">${escapeHtml(it.han_viet)}</span>` : '';
  return `
    <div class="radical-card">
      ${numBadge}
      <div class="radical-head">
        <div class="radical-char">${charDisplay}</div>
        <div class="radical-meta">
          <div class="radical-name">${escapeHtml(it.vi_name||'')}</div>
          <div class="radical-pinyin">
            ${escapeHtml(it.pinyin||'')} ${hanViet}
            <button class="audio-btn" data-speak="${escapeAttr(speakChar)}" title="Phát âm" style="margin-left:6px">${SPEAKER_SVG}</button>
          </div>
          <div class="radical-stats">
            <span class="chip">${it.strokes||'?'} nét</span>
            ${it.position ? `<span class="chip">${escapeHtml(it.position)}</span>` : ''}
          </div>
        </div>
      </div>
      ${it.meaning?`<div class="radical-meaning"><strong>Ý nghĩa:</strong> ${escapeHtml(it.meaning)}</div>`:''}
      ${it.mnemonic?`<div class="radical-mnemonic">${escapeHtml(it.mnemonic)}</div>`:''}
      ${examples?`
        <div class="radical-examples-label">Chữ Hán có chứa bộ này:</div>
        <div class="radical-examples">${examples}</div>
      `:''}
    </div>
  `;
}

// Web Speech API for Chinese pronunciation
let chineseVoice = null;
function loadVoices(){
  const voices = window.speechSynthesis.getVoices();
  // Prefer zh-CN, then zh-HK or any zh
  chineseVoice = voices.find(v=>v.lang==='zh-CN')
              || voices.find(v=>v.lang.startsWith('zh-CN'))
              || voices.find(v=>v.lang==='zh-HK')
              || voices.find(v=>v.lang.startsWith('zh'))
              || null;
}
if(window.speechSynthesis){
  loadVoices();
  if(window.speechSynthesis.onvoiceschanged !== undefined){
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }
}

let currentBtn = null;
function speak(text, btn){
  if(!voiceEnabled){return}
  if(!window.speechSynthesis){
    alert('Trình duyệt của bạn không hỗ trợ phát âm. Hãy thử Chrome, Edge hoặc Safari.');
    return;
  }
  // Cancel any ongoing speech
  window.speechSynthesis.cancel();
  if(currentBtn){currentBtn.classList.remove('playing')}

  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-CN';
  if(chineseVoice) u.voice = chineseVoice;
  u.rate = 0.85;
  u.pitch = 1;

  if(btn){
    btn.classList.add('playing');
    currentBtn = btn;
  }
  u.onend = ()=>{ if(btn) btn.classList.remove('playing'); currentBtn=null; };
  u.onerror = ()=>{ if(btn) btn.classList.remove('playing'); currentBtn=null; };
  window.speechSynthesis.speak(u);
}

// Escape helpers
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c])}
function escapeAttr(s){return escapeHtml(s)}

// Search
let searchTimeout;
$search.addEventListener('input',e=>{
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(()=>{
    searchQuery = e.target.value;
    render();
  },150);
});

// Voice toggle
$voiceToggle.addEventListener('click',()=>{
  voiceEnabled = !voiceEnabled;
  $voiceToggle.classList.toggle('muted', !voiceEnabled);
  if(!voiceEnabled){window.speechSynthesis.cancel()}
});

// Init
renderStats();
renderTabs();
renderSubNav();
render();
</script>
